worker_processes auto;
events { worker_connections 1024; }

# --- RTMP ingest -----------------------------------------------------------
# This is the piece Phase 1 is really testing: does a CONTINUOUS ffplayout
# push behave here the way an OBS push does? Production cinezoo.tv runs the
# same module with the same "live" application.
rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;

      # HLS output. hls_nested puts each stream in its own folder, so the
      # playable URL is /hls/<stream_key>/index.m3u8 — identical to what
      # VideoPlayer.tsx already builds in production (HLS_BASE + /hls/<key>/).
      hls on;
      hls_path /tmp/hls;
      hls_nested on;
      hls_fragment 3s;
      hls_playlist_length 60s;

      # Production also fires an on_publish auth hook at Cinezoo's
      # /api/rtmp/auth (rtmpController.verifyStreamKey). Left OFF here so the
      # harness runs with zero Cinezoo backend. To exercise it, uncomment and
      # point at a running backend:
      # on_publish http://host.docker.internal:5000/api/rtmp/auth;
    }
  }
}

# --- HLS delivery ----------------------------------------------------------
http {
  access_log off;
  server {
    listen 8080;

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /tmp;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;   # so watch.html can fetch it
    }

    # Simple landing so hitting the edge in a browser isn't a 404.
    location / {
      return 200 "Cinezoo Phase 1 edge. HLS lives under /hls/<stream_key>/index.m3u8\n";
      default_type text/plain;
    }
  }
}
